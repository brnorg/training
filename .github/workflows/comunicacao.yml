name: comunicacao entre jobs
run-name: "comunicação entre runners executado por ${{ github.actor }} " 

on:
  workflow_dispatch:

jobs:
  CI:
    name: ci - job1
    runs-on: ubuntu-latest
    outputs:
      primeiro: ${{ steps.idStep1.outputs.primeriaSaida }}
      segundo: ${{ steps.saida.outputs.segundaSaida }}
    steps:
      - name: step1
        id: idStep1
        run: echo primeriaSaida=valor1 >> $GITHUB_OUTPUT
      - name: step2
        id: saida
        run: echo segundaSaida=valor2 >> $GITHUB_OUTPUT

  VERIFY:
    name: verifica job
    runs-on: ubuntu-latest
    needs: CI      
    env:
      primeiro: ${{ needs.CI.outputs.primeiro }}
      segundo: ${{ needs.CI.outputs.segundo }}
    steps:
      - run: echo $primeiro-output
      - run: echo $segundo-output
      - name: criando outra variavel de ambiente
        run: echo "NOVAVARIAVEL=novoValor" >> $GITHUB_ENV

      - name: acessando variavel criada
        run: echo $NOVAVARIAVEL
        
